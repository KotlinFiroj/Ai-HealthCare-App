version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mediai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mediai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: mediai_redis
    restart: always
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: mediai_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/persona

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediai_backend
    restart: always
    depends_on:
      - db
      - redis
      - chromadb
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mediai_db}
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chromadb:8000
    ports:
      - "8888:8888"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediai_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mediai_db}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  nginx:
    image: nginx:alpine
    container_name: mediai_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
